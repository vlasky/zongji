---
services:
  mysql57:
    image: mysql:5.7
    command: [ "--server-id=1", "--log-bin=/var/lib/mysql/mysql-bin.log", "--binlog-format=row"]
    networks:
      default:
        aliases:
          - mysql57
    environment:
      MYSQL_ROOT_PASSWORD: secret

  mysql80:
    image: mysql:8.0
    command: [ "--server-id=1", "--log-bin=/var/lib/mysql/mysql-bin.log", "--binlog-format=row"]
    networks:
      default:
        aliases:
          - mysql80
    environment:
      MYSQL_ROOT_PASSWORD: secret

  mysql84:
    image: mysql:8.4
    command: [ "--server-id=1", "--log-bin=/var/lib/mysql/mysql-bin.log", "--binlog-format=row"]
    ports:
      - "3306:3306"
    networks:
      default:
        aliases:
          - mysql84
    environment:
      MYSQL_ROOT_PASSWORD: secret

  mariadb118:
    image: mariadb:11.8
    command: [ "--server-id=1", "--log-bin=/var/lib/mysql/mysql-bin.log", "--binlog-format=row"]
    ports:
      - "3308:3306"
    networks:
      default:
        aliases:
          - mariadb118
    environment:
      MARIADB_ROOT_PASSWORD: secret
